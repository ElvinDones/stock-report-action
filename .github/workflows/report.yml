name: Daglig aksjerapport

on:
  # Kjør automatisk hver hverdag kl. 07:00 UTC (09:00 norsk vintertid)
  schedule:
    - cron: "0 7 * * 1-5"
  # Gjør at du også kan trigge den manuelt fra "Actions"-fanen på GitHub
  workflow_dispatch:

jobs:
  generer-rapport:
    runs-on: ubuntu-latest

    # Gir jobben lov til å pushe endringer tilbake til repoet
    permissions:
      contents: write

    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Kjør rapport-script
        run: python report.py

      - name: Commit og push rapport
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatisk rapport ${{ github.run_number }}"
          file_pattern: "reports/*.md docs/*.html"
